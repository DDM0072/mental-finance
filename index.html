<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">

<title>Mental Finance</title>
<style>
/* Simple model, phone first: plan (cascade) → one weekly number (what you set aside) → goal and fixed-cost levers. */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --ink: #15171c; --muted: #6b7080; --line: #e3e5ea; --track: #eceef2;
  --sel: #15171c; --sel-ink: #ffffff; --good: #15803d; --bad: #c2372b;
  --good-soft: #e7f5ec; --bad-soft: #fbe9e7; --accent: #2563eb; --warn: #a16207; --warn-soft: #fbf3dc;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --panel: #171a20; --ink: #eef0f4; --muted: #9aa0ae; --line: #262a33; --track: #23272f;
  --sel: #eef0f4; --sel-ink: #0f1115; --good: #4ade80; --bad: #f87171;
  --good-soft: #13291c; --bad-soft: #321716; --accent: #60a5fa; --warn: #fbbf24; --warn-soft: #33290f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a20; --ink: #eef0f4; --muted: #9aa0ae; --line: #262a33; --track: #23272f;
  --sel: #eef0f4; --sel-ink: #0f1115; --good: #4ade80; --bad: #f87171;
  --good-soft: #13291c; --bad-soft: #321716; --accent: #60a5fa; --warn: #fbbf24; --warn-soft: #33290f; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.app { max-width: 36rem; margin-inline: auto; padding: 18px 16px calc(92px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; }
.chip { font-size: 0.8rem; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 1rem; font-weight: 600; margin: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.note { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--track); border-radius: 999px; }
.switch button { font-size: 0.82rem; font-weight: 500; border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* cascade: the personal income statement */
.cascade { display: flex; flex-direction: column; }
.cl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; font-size: 0.95rem; }
.cl + .cl { border-top: 1px solid var(--line); }
.cl .op { color: var(--muted); display: inline-block; width: 1.1em; }
.cl.sub { font-weight: 700; }
.cl.flex { background: var(--track); margin: 4px -10px; padding: 11px 10px; border-radius: 12px; border-top: 0; }
.cl.flex + .cl { border-top: 0; }
.cl .amt { display: inline-flex; align-items: baseline; gap: 8px; }
.cl .pct { color: var(--muted); font-weight: 500; font-size: 0.8rem; width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
.cl.goal .pct { color: var(--good); }
.cl.extra { font-size: 0.85rem; color: var(--muted); }
.cl.total { font-size: 1rem; }
.tag { font-size: 0.7rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--track); color: var(--muted); white-space: nowrap; }
.tag.d { background: var(--good-soft); color: var(--good); }
.seg2 { display: flex; gap: 4px; padding: 3px; background: var(--track); border-radius: 10px; }
.seg2 button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 0.88rem; color: var(--muted); cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.cat-help { font-size: 0.8rem; color: var(--muted); line-height: 1.45; margin: -2px 0 0; }
.grp { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding-top: 6px; }
.seg3v { margin-top: -2px; }
.chartbox { width: 100%; min-height: 40px; }
.chartbox svg { display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chartbox text { font-family: var(--font); }
.chartbox .v { font-size: 11.5px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.chartbox .p { font-size: 10.5px; fill: var(--muted); }
.chartbox .lab { font-size: 11px; fill: var(--muted); }
.chartbox .tk { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chartbox .goal-t { fill: var(--ink); font-weight: 700; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.legend i { display: inline-block; width: 16px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 2px solid; }
.mlist { display: flex; flex-direction: column; }
.meta { border-top: 1px solid var(--line); }
.meta summary { list-style: none; cursor: pointer; padding: 12px 0; }
.meta summary::-webkit-details-marker { display: none; }
.meta summary b { font-weight: 600; }
.msub { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; color: var(--muted); }
.msub .eta-s { color: var(--ink); font-weight: 600; }
.mbody, .mform { display: flex; flex-direction: column; gap: 12px; padding: 2px 0 16px; }
.inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.hist { display: flex; flex-direction: column; gap: 2px; }
.upd-in { flex: 1; }
.mark.warn { background: var(--warn-soft); color: var(--warn); } .mark.na { background: var(--track); color: var(--muted); }
.verdict b.warn { color: var(--warn); }
.proto { font-size: 0.7rem; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 7px; vertical-align: 2px; margin-left: 4px; }
.principio { font-size: 0.82rem; line-height: 1.5; color: var(--muted); background: var(--track); border-radius: 12px; padding: 10px 12px; }
.principio b { color: var(--ink); }
.hcierres { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.cfilas { display: flex; flex-direction: column; }
.chead, .cfila { display: grid; grid-template-columns: minmax(0, 1fr) auto 2.6rem 2.6rem 2.6rem; gap: 6px; align-items: center; }
.chead { font-size: 0.72rem; color: var(--muted); padding: 0 8px 4px; }
.chead span:nth-child(2) { text-align: right; }
.cc { display: flex; justify-content: center; }
.cfila { width: 100%; border: 0; background: none; padding: 8px; border-radius: 10px; cursor: pointer; text-align: left; font-size: 0.92rem; }
.cfila + .cfila { border-top: 1px solid var(--line); border-radius: 0; }
.cfila.on { background: var(--track); border-radius: 10px; }
.cfila .cm { font-weight: 600; white-space: nowrap; } .cfila .cd { text-align: right; font-weight: 600; }
.cd.ok { color: var(--good); } .cd.warn { color: var(--warn); } .cd.no { color: var(--bad); }
.cfila .mark { width: 24px; height: 24px; font-size: 0.75rem; }
.tlist { display: flex; flex-direction: column; gap: 8px; }
.ci-total { font-size: 0.85rem; font-weight: 600; text-align: right; }
.mform .switch button { padding: 4px 10px; font-size: 0.78rem; white-space: nowrap; }
.mform .switch { flex: none; }
.reserva { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.reserva .bar { position: relative; overflow: visible; }
.liq { font-size: 0.88rem; }
.liq b { font-weight: 700; }
.ask { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--warn-soft); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.fld .hint { font-size: 0.75rem; line-height: 1.4; }
.tip { font-size: 0.8rem; line-height: 1.45; color: var(--muted); margin: 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--track); border-radius: 0 8px 8px 0; }
.tip b { color: var(--ink); }
.pago-q { font-size: 1.15rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
.dots { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
.dot { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.66rem; color: var(--muted); padding-top: 8px; }
.dot .mark { width: 22px; height: 22px; font-size: 0.75rem; }
.plan-note { font-size: 0.75rem; color: var(--muted); line-height: 1.45; margin: -2px 0 0; }
.cl.goal { font-weight: 700; color: var(--good); }

/* weekly check */
.big { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.k { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
.mark { flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: 0.85rem; }
.mark.ok { background: var(--good-soft); color: var(--good); } .mark.no { background: var(--bad-soft); color: var(--bad); }
.verdict { display: flex; gap: 10px; align-items: flex-start; font-size: 0.95rem; line-height: 1.4; }
.verdict b.ok { color: var(--good); } .verdict b.no { color: var(--bad); }
.bar { position: relative; height: 10px; background: var(--track); border-radius: 999px; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--good); }
.fill.no { background: var(--bad); }
.fill.acc { background: var(--accent); }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
.entry { display: flex; gap: 8px; }
.entry input, .fld input, .fld select { width: 100%; font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
.btn.small { padding: 5px 10px; font-size: 0.82rem; font-weight: 500; }
.btn.ghost { border: 0; background: none; padding: 4px 0; color: var(--muted); font-weight: 500; font-size: 0.85rem; text-decoration: underline; }
.weeks { display: flex; flex-direction: column; }
.wk { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 0.9rem; }
.wk + .wk { border-top: 1px solid var(--line); }
.wk .d { flex: 1; color: var(--muted); }
.wk .a { font-weight: 600; }
.wk .mark { width: 22px; height: 22px; font-size: 0.75rem; }

/* goal & levers */
.goal-v { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.eta { font-size: 1.05rem; font-weight: 600; line-height: 1.35; }
.lever { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; }
.lever + .lever { border-top: 1px solid var(--line); }
.lever .top b { font-weight: 600; }
.lever .gain { color: var(--good); font-weight: 600; font-size: 0.85rem; }

/* model form */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); min-width: 0; }
.fl { display: flex; flex-direction: column; }
.fijo + .fijo { border-top: 1px solid var(--line); }
.fijo summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; cursor: pointer; }
.fijo summary::-webkit-details-marker { display: none; }
.fijo summary::after { content: '›'; color: var(--muted); font-size: 1.2rem; transition: transform .15s; }
.fijo[open] summary::after { transform: rotate(90deg); }
.fn { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.fn b { font-weight: 600; } .fs { font-size: 0.8rem; color: var(--muted); }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 0.88rem; line-height: 1.35; cursor: pointer; }
.chk input { width: 18px; height: 18px; margin: 1px 0 0; flex: none; accent-color: var(--ink); }
.fa { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.fbody { display: flex; flex-direction: column; gap: 10px; padding: 2px 0 14px; }
.fijo .meta { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.result { font-size: 1rem; font-weight: 600; line-height: 1.45; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 4px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 3; }
.tabbar button { flex: 1 1 0; max-width: 10rem; border: 0; background: none; padding: 9px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; color: var(--muted); cursor: pointer; }
.tabbar button[aria-selected="true"] { color: var(--ink); background: var(--track); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 0.88rem; max-width: calc(100% - 32px); z-index: 4; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .35s ease-out; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabbar" role="tablist" aria-label="Secciones">
  <button role="tab" id="tab-hoy" data-tab="hoy" aria-selected="true">Hoy</button>
  <button role="tab" id="tab-modelo" data-tab="modelo" aria-selected="false">Mi modelo</button>
</nav>
<div class="toast" id="toast" hidden></div>
<script id="seed" type="application/json">{"modelo": {"ingresoMonto": 0, "ingresoFrecuencia": "Semanal", "ahorroPct": 0.2, "diaPago": 5, "fijos": [], "tarjetas": [], "deudaModo": "tarjeta", "piso": {"pctFijos": 1, "pctFlex": 0.5}}}</script>
<script>
(() => {
  'use strict';
  // ---------------------------------------------------------- helpers
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false && kid !== '') el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
  const money = (n) => fmt.format(Math.round(n || 0));
  const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const corto = (d) => `${+d.slice(8)} ${MES[+d.slice(5, 7) - 1]}`;
  const largo = (d) => `${+d.slice(8)} de ${MESL[+d.slice(5, 7) - 1]} de ${d.slice(0, 4)}`;
  const mesAnio = (ym) => `${MESL[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
  const addDays = (d, n) => { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5);
  const today = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
  const lunes = (d) => { const k = (new Date(d + 'T12:00:00Z').getUTCDay() + 6) % 7; return addDays(d, -k); };
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); };

  // ---------------------------------------------------------- model
  // Times per year. Quincenal = paid the 15th and month-end (24); every two weeks is Catorcenal (26).
  const FREQ = { Semanal: 52, Catorcenal: 26, Quincenal: 24, Mensual: 12, Bimestral: 6, Trimestral: 4, Semestral: 2, Anual: 1 };
  const FREQ_TXT = { Semanal: 'cada semana', Catorcenal: 'cada 2 semanas', Quincenal: 'el 15 y fin de mes', Mensual: 'cada mes', Bimestral: 'cada 2 meses', Trimestral: 'cada 3 meses', Semestral: 'cada 6 meses', Anual: 'cada año' };
  // Essential + end date = a payment plan you'll renew (stays in the plan). Discretionary + end date = it really ends.
  const activo = (f, ym) => !(f.inicia && f.inicia > ym) && !(f.termina && f.tipo === 'discrecional' && f.termina < ym);
  const CATS = {
    'esencial-sin': { tag: 'Esencial', txt: 'Lo necesitas y no termina. Ej. gastos médicos, renta, servicios.' },
    'esencial-con': { tag: 'Esencial con fin', txt: 'Lo necesitas; esta forma de pago termina pero lo vas a renovar, así que sigue contando en tu plan. Ej. seguro pagado a meses.' },
    'discrecional-con': { tag: 'Discrecional con fin', txt: 'Lo elegiste y termina solo. Al terminar sale de tu plan y libera dinero. Ej. compra a meses, préstamo.' },
    'discrecional-sin': { tag: 'Discrecional', txt: 'Lo elegiste y sigue hasta que lo canceles. Podrías quitarlo si lo necesitas. Ej. suscripciones.' },
  };
  const cat = (f) => `${f.tipo === 'discrecional' ? 'discrecional' : 'esencial'}-${f.termina ? 'con' : 'sin'}`;
  function plan(m, ym) {
    const ingreso = Number(m.ingresoMonto || 0) * (FREQ[m.ingresoFrecuencia] || 52) / 52;
    const fijosAct = (m.fijos || []).filter((f) => activo(f, ym));
    const fijos = fijosAct.reduce((a, f) => a + Number(f.monto || 0) * (FREQ[f.frecuencia] || 12) / 52, 0);
    const bruta = ingreso - fijos;
    const ahorro = ingreso * Number(m.ahorroPct || 0);
    const sem = (f) => Number(f.monto || 0) * (FREQ[f.frecuencia] || 12) / 52;
    const ahorroEnFijos = fijosAct.filter((f) => f.esAhorro).reduce((a, f) => a + sem(f), 0);
    const discrecionales = fijosAct.filter((f) => f.tipo === 'discrecional').reduce((a, f) => a + sem(f), 0);
    return { ingreso, fijos, bruta, ahorro, flexible: bruta - ahorro, pctFijos: ingreso ? fijos / ingreso : 0, ahorroEnFijos, discrecionales };
  }

  // ---------------------------------------------------------- state & storage (per-browser; the page works without it)
  const seed = JSON.parse(document.getElementById('seed').textContent);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('mf.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('mf.' + k, JSON.stringify(v)); } catch (e) { /* preview without storage */ } },
  };
  const S = { modelo: store.get('modelo', seed.modelo), metas: store.get('metas', null), abierta: null, pagos: store.get('pagos', {}), cierres: store.get('cierres', []), cierreSel: null, vista: store.get('vista', 'sem'), planVer: store.get('planVer', 'tabla') === 'cascada' ? 'cascada' : 'tabla', tab: 'hoy', editando: null, abierto: null, ultimoRespaldo: store.get('ultimoRespaldo', null) };
  const save = (k) => store.set(k, S[k]);
  if (!S.metas) {
    S.metas = [];
    const old = store.get('meta', null), ap = store.get('apartados', {});
    if (old && old.nombre) {
      const saldos = [{ fecha: old.desde || today(), saldo: Number(old.inicial || 0) }]; let acc = Number(old.inicial || 0);

  // ---------------------------------------------------------- Cierre del mes: conciliación plan → flujo → patrimonio
  // Ahorro trabajado = saldos de metas − deuda de tarjetas (deuda total − lo que falta de tus compras a meses registradas)
  const mesesEntre = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
  function msiPendiente(fecha) {
    const ym = fecha.slice(0, 7);
    return (S.modelo.fijos || []).filter((f) => f.termina && f.termina > ym && !(f.inicia && f.inicia > ym)).reduce((a, f) => {
      const mensual = Number(f.monto || 0) * (FREQ[f.frecuencia] || 12) / 12;
      return a + mensual * mesesEntre(ym, f.termina);

  }
  const sumaMetas = (c) => Object.values(c.metas).reduce((a, v) => a + v, 0);

  const deudaConsumo = (c) => c.deuda - msiPendiente(c.fecha);
  function puente(a, b) {
    const comunes = Object.keys(b.metas).filter((id) => a.metas[id] != null);
    const nuevas = Object.keys(b.metas).filter((id) => a.metas[id] == null).reduce((s, id) => s + b.metas[id], 0);
    const quitadas = Object.keys(a.metas).filter((id) => b.metas[id] == null).reduce((s, id) => s + a.metas[id], 0);
    const dMetas = comunes.reduce((s, id) => s + b.metas[id] - a.metas[id], 0);
    const apartado = Object.entries(S.pagos).filter(([d]) => d > a.fecha && d <= b.fecha).reduce((s, [, v]) => s + v, 0);

    return { a, b, apartado, otros, dDeuda, nuevas, quitadas, pIni, pFin, semanas };
  }

  // generic bridge (waterfall) with a baseline near the smallest level, so changes are visible
  function puenteChart(items) {

      let lvl = 0; const lv = [];

      const hi = Math.max(...lv, ...items.filter((i) => i.tot).map((i) => i.v)) * 1.02;

        if (prevTop != null) svg.append(sv('line', { x1: band * (i - 1) + (band + bw) / 2, x2: x, y1: prevTop, y2: prevTop, stroke: 'var(--muted)', 'stroke-dasharray': '3 3', opacity: 0.6 }));

  const nombreTarjeta = (id) => ((S.modelo.tarjetas || []).find((t) => t.id === id) || { nombre: 'Tarjeta' }).nombre;

      h('div', { class: 'verdict' }, markR(g), h('div', {}, h('b', { class: g.cls }, `Tu ahorro trabajado ${dPat >= 0 ? 'creció' : 'bajó'} ${money(Math.abs(dPat))}.`), ` Tu plan para ese periodo: ${money(planPeriodo)}.`)));
    const items = [{ l: ['Al inicio'], v: pz.pIni, tot: true, c: 'var(--accent)' }, { l: ['Apartaste'], v: pz.apartado, c: 'var(--good)' }];
    if (Math.abs(pz.otros) >= 1) items.push({ l: ['Diferencia', 'en metas'], v: pz.otros, c: pz.otros >= 0 ? 'var(--good)' : 'var(--warn)' });

      const tag = h('span', { class: `tag ${f.tipo === 'discrecional' ? 'd' : ''}` }), help = h('p', { class: 'cat-help' });
      const ref = () => { sub.textContent = resumen(); an.textContent = `${money(anual())}/año`; nm.textContent = f.concepto; const c = CATS[cat(f)]; tag.textContent = f.esAhorro ? 'Ahorro' : c.tag; tag.className = `tag ${f.tipo === 'discrecional' && !f.esAhorro ? 'd' : ''}`; help.textContent = f.esAhorro ? 'Cuenta como gasto fijo en tu plan, pero también se suma a tu ahorro total. Ej. PPR, aportaciones voluntarias.' : c.txt; };
      const seg = h('div', { class: 'seg2', role: 'group', 'aria-label': `Tipo de ${f.concepto}` }, [['esencial', 'Esencial'], ['discrecional', 'Discrecional']].map(([k, l]) => h('button', { type: 'button', 'aria-pressed': String((f.tipo || 'esencial') === k), onclick: (e) => upd(() => { f.tipo = k; [...seg.children].forEach((b) => b.setAttribute('aria-pressed', String(b === e.currentTarget))); ref(); }) }, l)));
      ref();
      const d = h('details', { class: 'fijo', open: S.abierto === i ? true : null, ontoggle: (e) => { if (e.target.open) S.abierto = i; } },
        h('summary', {}, h('span', { class: 'fn' }, h('span', { class: 'inline' }, nm, ' ', tag), sub), an),
        h('div', { class: 'fbody' },
          h('label', { class: 'fld' }, 'Concepto', h('input', { type: 'text', value: f.concepto, oninput: (e) => upd(() => { f.concepto = e.target.value; ref(); }) })),
          h('div', { class: 'grid2' },
            h('label', { class: 'fld' }, 'Monto', h('input', { type: 'number', inputmode: 'decimal', value: String(f.monto), oninput: (e) => upd(() => { f.monto = Number(e.target.value || 0); ref(); }) })),
            h('label', { class: 'fld' }, 'Cada cuándo', sel(f.frecuencia, (v) => upd(() => { f.frecuencia = v; ref(); })))),
          h('div', { class: 'fld' }, '¿Lo necesitas o lo elegiste?', seg),
          h('div', { class: 'grid2' },
            h('label', { class: 'fld' }, '¿Termina? (vacío si no)', h('input', { type: 'month', value: f.termina || null, oninput: (e) => upd(() => { f.termina = e.target.value || null; ref(); }) })),
            h('label', { class: 'fld' }, '¿Desde cuándo? (opcional)', h('input', { type: 'month', value: f.inicia || null, oninput: (e) => upd(() => { f.inicia = e.target.value || null; ref(); }) }))),
          help,
          h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: f.esAhorro ? true : null, onchange: (e) => upd(() => { f.esAhorro = e.target.checked; ref(); }) }), h('span', {}, 'Es ahorro (ej. PPR)')),
          h('div', { class: 'meta' }, h('span', {}, `${P.ingreso ? Math.round(anual() / 52 / P.ingreso * 100) : 0}% de tu ingreso`), h('button', { class: 'btn small', 'aria-label': `Quitar ${f.concepto}`, onclick: () => { m.fijos.splice(i, 1); S.abierto = null; save('modelo'); render(); } }, 'Quitar'))));
      return d;
    }));
    const fijos = h('section', { class: 'card' }, h('div', { class: 'top' }, h('h2', {}, `Gastos fijos · ${money(P.fijos)} por semana`)),
      h('p', { class: 'note' }, 'Lo que pagas cada periodo, con su monto real. Márcalo como esencial (lo necesitas) o discrecional (lo elegiste y podrías quitarlo), y si tiene fecha de fin.'),
      list, h('button', { class: 'btn', onclick: () => { m.fijos.push({ concepto: 'Nuevo gasto fijo', monto: 0, frecuencia: 'Mensual', tipo: 'esencial' }); S.abierto = m.fijos.length - 1; save('modelo'); render(); } }, '+ Agregar gasto fijo'));
    const tarjetas = h('section', { class: 'card', id: 'tarjetas' }, h('h2', {}, 'Tarjetas de crédito'),
      h('p', { class: 'note' }, 'Regístralas para capturar en tu cierre del mes cuánto debes en cada una. No necesitas números de tarjeta, solo un nombre.'),
      h('div', { class: 'tlist' }, (m.tarjetas || []).map((t, i) => h('div', { class: 'entry' },
        h('input', { type: 'text', value: t.nombre, 'aria-label': 'Nombre de la tarjeta', oninput: (e) => { t.nombre = e.target.value; save('modelo'); } }),
        h('button', { class: 'btn small', 'aria-label': `Quitar ${t.nombre}`, onclick: () => { m.tarjetas.splice(i, 1); save('modelo'); render(); } }, 'Quitar')))),
      h('button', { class: 'btn', onclick: () => { (m.tarjetas = m.tarjetas || []).push({ id: Math.random().toString(36).slice(2, 8), nombre: 'Nueva tarjeta' }); save('modelo'); render(); } }, '+ Agregar tarjeta'));
    const pc = pisoCfg(), pisoTxt = h('p', { class: 'result', id: 'piso-result' });
    const refPiso = () => { pisoTxt.textContent = `Tu piso: ${money(pisoMensual(plan(S.modelo, ym)))} en tus cuentas de débito.`; };
    const setPiso = (k, v) => { S.modelo.piso = Object.assign(pisoCfg(), { [k]: Math.max(0, Number(v || 0)) / 100 }); save('modelo'); refPiso(); };
    refPiso();
    const piso = h('section', { class: 'card', id: 'piso' }, h('h2', {}, 'Reserva para gastos'),
      h('p', { class: 'note' }, 'El piso que deberías mantener en tus cuentas de débito para cubrir lo que viene. Lo que tengas arriba es ahorro sin asignar; debajo, una señal de que gastas de más.'),
      h('div', { class: 'grid2' },
        h('label', { class: 'fld' }, '% de tus fijos del mes', h('input', { type: 'number', id: 'piso-f', inputmode: 'decimal', min: '0', value: String(Math.round(pc.pctFijos * 100)), oninput: (e) => setPiso('pctFijos', e.target.value) })),
        h('label', { class: 'fld' }, '% de tu flexible del mes', h('input', { type: 'number', id: 'piso-x', inputmode: 'decimal', min: '0', value: String(Math.round(pc.pctFlex * 100)), oninput: (e) => setPiso('pctFlex', e.target.value) }))),
      pisoTxt);
    return [h('div', { class: 'head' }, h('span', { class: 'brand' }, 'Mi modelo')), ingreso, fijos, tarjetas, piso, viewRespaldo()];
  }

  // ---------------------------------------------------------- shell
  function go(t) { S.tab = t; S.editando = null; render(); window.scrollTo(0, 0); }
  document.querySelectorAll('.tabbar button').forEach((b) => b.addEventListener('click', () => go(b.dataset.tab)));
  function render() {
    document.querySelectorAll('.tabbar button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
    $('#app').replaceChildren(...[].concat(S.tab === 'modelo' ? viewModelo() : viewHoy()).filter(Boolean));
  }
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
